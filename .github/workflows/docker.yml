name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          cd backend
          docker build -t saswat9/django-backend:latest .
          docker push saswat9/django-backend:latest

      - name: Build and push frontend image
        run: |
          cd frontend
          docker build -t saswat9/react-frontend:latest .
          docker push saswat9/react-frontend:latest
